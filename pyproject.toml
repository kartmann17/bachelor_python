[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["cinema/migrations"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.coverage.run]
source = ["cinema"]
branch = true
omit = ["*/migrations/*", "*/tests/*"]
[tool.coverage.report]
show_missing = true
skip_empty = true
