{% extends "base.html" %}
{% block title %}{{ title }} · Le Grand Cinéma{% endblock %}
{% block content %}
<section class="wrap shell">
  {% include "_staff_links.html" %}
  <h1 class="page-title">{{ title }}</h1>
  {% if description %}<p>{{ description }}</p>{% endif %}
  <form method="post" class="panel narrow stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">{{ submit }}</button>
  </form>
</section>
{% endblock %}
