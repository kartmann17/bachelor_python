{% extends "base.html" %}
{% block title %}Créer un compte · Le Grand Cinéma{% endblock %}
{% block content %}
<section class="wrap shell">
  <h1 class="page-title">Créer un compte</h1>
  <form method="post" class="panel narrow stack">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="button" type="submit">Créer mon compte</button>
  </form>
</section>
{% endblock %}
