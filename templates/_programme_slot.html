<div class="slot">
  <span><strong>{{ screening.starts_at|date:"H:i" }}</strong><small>{{ screening.room.format }}</small></span>
  {% if not screening.future %}
    <small>Séance commencée</small>
  {% elif not screening.available %}
    <span class="badge alert">Complet</span>
  {% else %}
    <small>{{ screening.available }} place{{ screening.available|pluralize }} disponible{{ screening.available|pluralize }}</small>
    <a class="button secondary" href="{% url 'book' screening.pk %}" aria-label="Réserver {{ screening.film }} à {{ screening.starts_at|date:'H:i' }}">Réserver</a>
  {% endif %}
</div>
