name: Qualité et tests
on:
  push:
    branches: [main, develop, "feature/**", "fix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: grand_cinema
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
    env:
      CINEMA_DEBUG: "1"
      DATABASE_URL: postgresql://cinema:ci-only@127.0.0.1:5432/grand_cinema
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "requirements*.txt"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: coverage run manage.py test cinema.tests
      - run: coverage report
      - run: coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: couverture-tests
          path: coverage.xml
